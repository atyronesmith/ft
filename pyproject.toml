[project]
name = "finetune"
version = "0.1.0"
description = "Generic fine-tuning application optimized for Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FineTune Team", email = "finetune@example.com" }]
requires-python = ">=3.11"
keywords = ["machine-learning", "fine-tuning", "llm", "mlx", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Bounds follow the old Poetry carets (>=x,<next major) except where a
# Dependabot fix required crossing one (2026-10-20): transformers 5,
# datasets 5, mlx 0.29, sentencepiece 0.2, pyarrow 21+, fastapi 0.133+,
# python-multipart 0.0.31+.
dependencies = [
    # Core ML frameworks
    "mlx>=0.29.4,<1.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.1.0,<3.0",
    "transformers>=5.10.1,<6.0",
    "peft>=0.7.0,<1.0",
    "datasets>=5.0.1,<6.0",
    "accelerate>=0.25.0",
    "tokenizers>=0.22.0,<1.0",
    "sentencepiece>=0.2.1,<1.0",
    # Web and API
    "fastapi>=0.133.0,<1.0",
    "uvicorn[standard]>=0.24.0,<1.0",
    "python-multipart>=0.0.31,<1.0",
    "websockets>=12.0.0,<13.0",
    "aiofiles>=23.2.0,<24.0",
    # CLI
    "typer[all]>=0.9.0,<1.0",
    "rich>=13.7.0,<14.0",
    "questionary>=2.0.0,<3.0",
    # Data processing
    "pandas>=2.1.0,<3.0",
    "pyarrow>=21.0.0",
    "h5py>=3.10.0,<4.0",
    "orjson>=3.9.0,<4.0",
    "pyyaml>=6.0.1,<7.0",
    # Configuration and validation
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    # Database
    "sqlalchemy>=2.0.0,<3.0",
    # Logging and monitoring
    "loguru>=0.7.0,<1.0",
    "tqdm>=4.66.0,<5.0",
    "tensorboard>=2.15.0,<3.0",
    # Visualization
    "matplotlib>=3.8.0,<4.0",
    # System utilities
    "psutil>=5.9.0,<6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.29.0,<2.0"]
monitoring = ["wandb>=0.16.0,<1.0", "plotly>=5.18.0,<6.0"]
config = ["hydra-core>=1.3.0,<2.0", "omegaconf>=2.3.0,<3.0"]
db = ["alembic>=1.13.0,<2.0"]
quantization = ["bitsandbytes>=0.41.0,<1.0"]
all = [
    "finetune[ui,monitoring,config,db,quantization]",
]

[project.scripts]
ft = "finetune.cli.app:main"
finetune = "finetune.cli.app:main"

[project.urls]
Homepage = "https://github.com/atyronesmith/ft"
Repository = "https://github.com/atyronesmith/ft"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0,<4.0",
    "hypothesis>=6.92.0,<7.0",
    "ruff>=0.1.0",
    "black>=24.3.0,<25.0",
    "mypy>=1.7.0,<2.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.27.0,<7.0",
    "notebook>=7.0.0,<8.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.24.0",
    "pdoc>=14.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in init files
"tests/*" = ["S101"]       # use of assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "mlx.*",
    "transformers.*",
    "datasets.*",
    "streamlit.*",
    "tensorboard.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=finetune",
    "--cov-report=term-missing",
    "--cov-report=html",
]
filterwarnings = [
    "ignore::ResourceWarning:unittest.mock",
    "ignore::ResourceWarning:click.testing",
    "ignore::ResourceWarning:codecs",
    "ignore::ResourceWarning:importlib",
]
markers = [
    "requires_mlx: marks tests as requiring MLX (deselect with '-m \"not requires_mlx\"')",
    "requires_torch: marks tests as requiring PyTorch (deselect with '-m \"not requires_torch\"')",
    "requires_transformers: marks tests as requiring Transformers (deselect with '-m \"not requires_transformers\"')",
    "requires_real_model: marks tests as requiring real model loading (deselect with '-m \"not requires_real_model\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
^/(
  (
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
skip_glob = ["**/migrations/*", ".venv/*"]

[tool.coverage.run]
source = ["src/finetune"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/ui/*",  # Exclude UI code from coverage
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
